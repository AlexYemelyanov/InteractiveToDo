<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.sass">
  <script src="https://kit.fontawesome.com/6e96f7e789.js" crossorigin="anonymous"></script>
  <title>Zonify</title>
</head>

<body>
  <header>
    <div class="wrapper">
      <div class="container container__header">
        <div class="header">
          <div class="header__logo">
            <svg width="100" height="100" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
              <style>
                .bg {
                  fill: rgba(0, 0, 0, 1);
                }

                .ring {
                  fill: none;
                  stroke: #00ffea;
                  stroke-width: 4;
                  filter: url(#glowBlue);
                }

                .text {
                  font: bold 40px 'Segoe UI', sans-serif;
                  fill: #73ff00;
                  filter: url(#glowBlue);
                }

                .zoneO {
                  fill: none;
                  stroke: #ff1100;
                  stroke-width: 4;
                  filter: url(#glowGreen);
                }
              </style>

              <defs>
                <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="4" result="coloredBlur" />
                  <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
                <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="4" result="coloredBlur" />
                  <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              <!-- Background -->
              <!-- <rect class="bg" width="300" height="300" /> -->

              <!-- Outer ring -->
              <circle class="ring" cx="150" cy="150" r="100" />

              <!-- Text -->
              <text class="text" x="90" y="160">Z</text>
              <circle class="zoneO" cx="130" cy="145" r="12" />
              <text class="text" x="145" y="160">nify</text>
            </svg>
          </div>
          <div class="header__time">17:44</div>
          <div class="header__auth">
            <button class="btn btn__logIn">Log in</button>
            <button class="btn btn__signIn">Sign in</button>
          </div>
          <div class="header__dark-lite">
            <input type="checkbox" class="switchMode" name="switchMode" id="toggleDarkMode">
            <label for="toggleDarkMode" class="switchMode__label">
              <i class="fas fa-moon"></i>
              <i class="fas fa-sun"></i>
              <span class="ball"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="wrapper">
      <div class="container">
        <div class="main">
          <div class="slidly-zone-menu">
            <h3>Zone your tasks</h3>
            <div class="slidly-zone-menu__toggler"></div>
            <button class="btn slidly-zone-menu__btn">Add zone</button>
          </div>
          <section class="todo__colums">
            <div class="todo__colum">
              <h4>ToDo</h4>
              <button class="btn addTask__btn">Add task</button>
            </div>
            <div class="todo__colum">
              <h4>In progress</h4>
            </div>
            <div class="todo__colum">
              <h4>Done</h4>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <div class="popup popup__addZone" id="addZone">
    <div class="popup__overlay">
      <div class="popup__form">
        <div class="popup__close">X</div>
        <form action="POST" class="popup__form-zone" id="form-zone">
          <input type="text" class="popup__form-elem" placeholder="Add new zone">
          <button>Confirm</button>
        </form>
      </div>
    </div>
  </div>
  <div class="popup popup__addTask" id="addTask">
    <div class="popup__overlay">
      <div class="popup__form">
        <div class="popup__close">X</div>
        <form action="POST" class="popup__form-task" id="form-task">
          <input type="text" class="popup__form-elem" placeholder="Title...">
          <textarea name="description" id="descr" class="popup__form-elem" cols="30" rows="10"
            placeholder="Description for your task..."></textarea>
          <button>Confirm</button>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
